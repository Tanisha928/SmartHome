# Nginx in front of uvicorn on every API instance. TLS terminates at the ALB.
upstream api {
    server 127.0.0.1:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    server_name _;

    # ALB sits in the VPC; trust its X-Forwarded-For for client IPs (login rate limiting).
    set_real_ip_from 10.0.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 26m;  # MAX_CLIP_MB=25 plus multipart overhead
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_set_header Connection "";

    location = /healthz {
        proxy_pass http://api;
        access_log off;
    }

    location /api/ingest/ {
        proxy_pass http://api;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;  # server pings every 25 s
    }

    location /assets/ {
        root /var/www/smarthome;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /var/www/smarthome;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
