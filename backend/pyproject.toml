[project]
name = "smarthome-backend"
version = "0.1.0"
description = "Intelligent Cloud Platform for Smart Homes — modular monolith"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "pymongo>=4.10.0",
  "boto3>=1.35.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.1",
  "httpx>=0.27.0",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "python-multipart>=0.0.12",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "freezegun>=1.5.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "import-linter>=2.1",
  "types-passlib",
  "types-python-jose",
  "boto3-stubs[s3,sqs,sns]",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Persistence isolation"
type = "forbidden"
source_modules = [
  "app.auth",
  "app.iot",
  "app.alerts",
  "app.ml",
  "app.workers",
  "app.core",
]
forbidden_modules = [
  "sqlalchemy",
  "pymongo",
  "boto3",
]
ignore_imports = [
  "app.workers -> boto3",
]
